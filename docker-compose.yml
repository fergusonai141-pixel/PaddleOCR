services:
  paddleocr-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddleocr-mcp
    ports:
      - "8000:8000"
    environment:
      - PADDLEOCR_MCP_PIPELINE=OCR
      - PADDLEOCR_MCP_PPOCR_SOURCE=local
      - PADDLEOCR_MCP_DEVICE=cpu
      - PADDLEOCR_MCP_TIMEOUT=60
      - PADDLEOCR_MCP_VERBOSE=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
