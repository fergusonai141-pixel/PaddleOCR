services:
  paddleocr-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paddleocr-mcp
    ports:
      - "8000:8000"
    environment:
      - PADDLEOCR_MCP_PIPELINE=EasyOCR
      - PADDLEOCR_MCP_PPOCR_SOURCE=local
      - PADDLEOCR_MCP_DEVICE=cpu
      - PADDLEOCR_MCP_TIMEOUT=60
      - PADDLEOCR_MCP_VERBOSE=false
      - FLAGS_use_onednn=0
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
    command: ["python", "-m", "mcp_server.paddleocr_mcp", "--http"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
